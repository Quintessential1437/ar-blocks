<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>BLOCKS — AR Building</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <video id="handVideo" playsinline muted></video>

  <div id="hud">
    <div class="brand">BLOCKS</div>
    <div id="status">Starting camera…</div>
    <button id="spawn" type="button">＋ BLOCK</button>
  </div>

  <div id="hint">
    <div class="hand-icon">🤏</div>
    <div>Pinch a block to grab it</div>
  </div>

  <div id="error" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://libs.zappar.com/zappar-threejs/2.4.6/zappar-threejs.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="game.js"></script>
</body>
</html>
