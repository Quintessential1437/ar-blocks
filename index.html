<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >
  <title>AR Tetris Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- CAMERA -->
  <video
    id="camera"
    autoplay
    playsinline
    muted
  ></video>
  <!-- 3D GAME -->
  <canvas id="game"></canvas>
  <!-- START SCREEN -->
  <div id="startScreen">
    <h1>AR TETRIS</h1>
    <p id="message">
      Tap below to start the camera
    </p>
    <button id="startButton">
      START AR
    </button>
  </div>
  <!-- GAME UI -->
  <div id="hud">
    <div id="title">
      AR TETRIS
    </div>
    <div id="score">
      SCORE: 0
    </div>
    <div id="hint">
      Swipe ← → to move<br>
      Tap to rotate
    </div>
  </div>
  <!-- THREE.JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- GAME -->
  <script src="game.js"></script>
</body>
</html>
